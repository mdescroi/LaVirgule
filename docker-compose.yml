services:
  db:
    image: postgres:16-alpine
    container_name: lavirgule-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lavirgule
      POSTGRES_PASSWORD: lavirgule_dev_password
      POSTGRES_DB: lavirgule
    ports:
      - "5433:5432"
    volumes:
      - lavirgule_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavirgule -d lavirgule"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lavirgule_pgdata:
